name: Build ShadowLite IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install xcodegen

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: ThirdParty/ShadowBoxCore/go.sum

      - name: Build ShadowBoxCore framework
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          gomobile init
          cd ThirdParty/ShadowBoxCore
          go mod tidy
          mkdir -p build
          gomobile bind \
            -v \
            -target ios \
            -libname=ShadowBoxCore \
            -tags "with_gvisor,with_quic,with_wireguard,with_utls,with_naive_outbound,with_clash_api,badlinkname,tfogo_checklinkname0,with_dhcp,grpcnotrace" \
            -o build/ShadowBoxCore.xcframework \
            .

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project ShadowLite.xcodeproj \
            -scheme ShadowLite \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH="$(find build/DerivedData -path '*Release-iphoneos/ShadowLite.app' -type d | head -n 1)"
          test -n "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/ShadowLite.app
          cd build
          zip -qry ShadowLite-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShadowLite-unsigned-ipa
          path: build/ShadowLite-unsigned.ipa
