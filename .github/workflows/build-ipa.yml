name: Build ShadowLite IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install xcodegen

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Build ShadowBoxCore framework
        run: |
          set -euo pipefail
          mkdir -p build/logs
          LOG_PATH="$GITHUB_WORKSPACE/build/logs/shadowboxcore-build.log"
          export PATH="$(go env GOPATH)/bin:$PATH"
          {
            go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
            go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
            gomobile init
            cd ThirdParty/ShadowBoxCore
            go mod tidy
            mkdir -p build
            gomobile bind \
              -v \
              -target ios \
              -libname=ShadowBoxCore \
              -tags "with_gvisor,with_quic,with_wireguard,with_utls,with_naive_outbound,with_clash_api,badlinkname,tfogo_checklinkname0,with_dhcp,grpcnotrace" \
              -o build/ShadowBoxCore.xcframework \
              .
            find build/ShadowBoxCore.xcframework -maxdepth 4 -type f | sort
            grep -R "CheckConfig\|Start\|Stop" build/ShadowBoxCore.xcframework || true
          } 2>&1 | tee "$LOG_PATH"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadowlite-build-logs
          path: build/logs/

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          set -euo pipefail
          mkdir -p build/logs
          xcodebuild \
            -project ShadowLite.xcodeproj \
            -scheme ShadowLite \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build/logs/xcodebuild.log

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData -path '*Release-iphoneos/ShadowLite.app' -type d | head -n 1)"
          test -n "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/ShadowLite.app
          APP_BUNDLE="$GITHUB_WORKSPACE/build/Payload/ShadowLite.app"
          EXTENSION_BUNDLE="$APP_BUNDLE/PlugIns/ShadowLiteTunnel.appex"
          ENTITLEMENTS="$GITHUB_WORKSPACE/Configuration/ShadowLite.entitlements"
          test -d "$EXTENSION_BUNDLE"

          # The IPA is installed through TrollStore without an Apple profile.
          # Re-sign nested code ad-hoc so NetworkExtension entitlements survive installation.
          while IFS= read -r framework; do
            codesign --force --sign - --timestamp=none "$framework"
          done < <(find "$EXTENSION_BUNDLE" -type d -name '*.framework' | sort -r)
          codesign --force --sign - --entitlements "$ENTITLEMENTS" --timestamp=none "$EXTENSION_BUNDLE"
          codesign --force --sign - --entitlements "$ENTITLEMENTS" --timestamp=none "$APP_BUNDLE"
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"
          codesign -d --entitlements :- "$APP_BUNDLE" 2>&1 | tee build/logs/app-entitlements.log
          codesign -d --entitlements :- "$EXTENSION_BUNDLE" 2>&1 | tee build/logs/tunnel-entitlements.log
          cd build
          zip -qry ShadowLite-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShadowLite-unsigned-ipa
          path: build/ShadowLite-unsigned.ipa

      - name: Commit IPA to repository
        run: |
          set -euo pipefail
          mkdir -p builds
          cp build/ShadowLite-unsigned.ipa builds/ShadowLite-unsigned.ipa
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f builds/ShadowLite-unsigned.ipa
          git commit -m "Update signed ShadowLite IPA [skip ci]" || exit 0
          git push
